# NÃO commitar o secret real. Crie assim (troque os valores!):
#
#   kubectl -n churrasquin create secret generic churrasquin-secrets \
#     --from-literal=POSTGRES_USER=churrasquin \
#     --from-literal=POSTGRES_PASSWORD='troque-esta-senha' \
#     --from-literal=POSTGRES_DB=churrasquin \
#     --from-literal=DATABASE_URL='postgresql://churrasquin:troque-esta-senha@db:5432/churrasquin' \
#     --from-literal=JWT_SECRET='gere-um-segredo-longo-aleatorio'
#
apiVersion: v1
kind: Secret
metadata:
  name: churrasquin-secrets
  namespace: churrasquin
stringData:
  POSTGRES_USER: churrasquin
  POSTGRES_PASSWORD: troque-esta-senha
  POSTGRES_DB: churrasquin
  DATABASE_URL: postgresql://churrasquin:troque-esta-senha@db:5432/churrasquin
  JWT_SECRET: gere-um-segredo-longo-aleatorio
