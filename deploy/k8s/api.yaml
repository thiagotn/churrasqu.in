apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: churrasquin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Migrations antes de cada rollout (idempotente)
      initContainers:
        - name: migrate
          image: churrasquin-api
          command: ['npm', 'run', 'prisma:deploy', '--workspace=apps/api']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: churrasquin-secrets
                  key: DATABASE_URL
      containers:
        - name: api
          image: churrasquin-api
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: CORS_ORIGIN
              value: 'https://churrasqu.in'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: churrasquin-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: churrasquin-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: churrasquin
spec:
  selector:
    app: api
  ports:
    - port: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: churrasquin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
