apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: churrasquin
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
# Aponte para o seu registry/tag:
#   kustomize edit set image churrasquin-api=registry.seu-homelab/churrasquin-api:v0.1.0
images:
  - name: churrasquin-api
    newName: churrasquin-api
    newTag: latest
  - name: churrasquin-web
    newName: churrasquin-web
    newTag: latest
